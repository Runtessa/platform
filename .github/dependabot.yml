version: 2
updates:
  # npm cannot traverse private gitlinks. Component npm manifests are maintained
  # in their own repositories; refresh the integration lock with each gitlink PR.
  - package-ecosystem: npm
    directory: /docs/site
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "@mermaid-js/layout-elk"
        versions: [">0.1.9"]
    groups:
      patch-and-minor:
        update-types: [patch, minor]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
