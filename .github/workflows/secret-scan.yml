name: Repository verification

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ide-authorization:
    # Native bubblewrap requires a host allowing unprivileged user namespaces.
    # Do not disable AppArmor/user-namespace restrictions on a moving runner image.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Checkout pinned component repositories
        uses: ./.github/actions/checkout-components
        with:
          ssh-private-key: ${{ secrets.RUNTESSA_COMPONENT_KEYS }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked workspace dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Build shared entity types
        run: npm run build:shared
      - name: Verify recursive scanner coverage
        run: node --test scripts/quality/git-files.test.cjs
      - name: Parse source and enumerate duplicate candidates
        run: npm run quality:source
      - name: Verify shared parsing, Gateway and Agent contracts
        run: npm run test:contracts
      - name: Check IDE types
        run: npm --prefix src/ideNew run type-check
      - name: Build Core types
        run: npm --prefix src/core run build
      - name: Verify Core dispatch and authenticated draft preview
        run: npm --prefix src/core test
      - name: Verify tenant authorization and rollback boundaries
        run: npm --prefix src/ideNew run test:security
      - name: Verify sensitive logging boundaries
        run: npm run test:logging
      - name: Verify explicit schema migrations with disposable PostgreSQL
        run: npm run test:database
      - name: Install runtime isolation dependency
        run: sudo apt-get update && sudo apt-get install --yes bubblewrap
      - name: Verify host namespace prerequisites
        run: bwrap --unshare-user --unshare-pid --die-with-parent --new-session --clearenv --ro-bind / / -- /usr/bin/true
      - name: Verify live code compatibility and OS isolation
        run: npm run test:runtime
      - name: Verify native models and read-only SQL against PostgreSQL
        run: npm run test:runtime:integration
      - name: Verify fresh database setup and live HTTP edits
        run: npm run test:installation
      - name: Install locked Kernel dependencies
        run: npm --prefix src/kernel ci --ignore-scripts
      - name: Verify actual production image migration, HTTP ingress and live code
        run: npm run test:container
  infrastructure-tls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Checkout pinned component repositories
        uses: ./.github/actions/checkout-components
        with:
          ssh-private-key: ${{ secrets.RUNTESSA_COMPONENT_KEYS }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm --prefix src/monitoring ci --ignore-scripts
      - run: npm --prefix src/container-agent ci --ignore-scripts
      - name: Verify Monitoring HTTP and actual Redis pub/sub
        run: npm run test:monitoring
      - name: Verify certificate generation and required TLS
        run: npm run test:tls
  auth-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Checkout pinned component repositories
        uses: ./.github/actions/checkout-components
        with:
          ssh-private-key: ${{ secrets.RUNTESSA_COMPONENT_KEYS }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/auth/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Install locked Auth dependencies without lifecycle scripts
        run: npm --prefix src/auth ci --ignore-scripts
      - name: Build Auth server types
        run: npm --prefix src/auth run build:server
      - name: Check Auth types
        run: npm --prefix src/auth run type-check
      - name: Verify Auth OAuth with disposable PostgreSQL
        run: npm run test:auth
  vscode-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Checkout pinned component repositories
        uses: ./.github/actions/checkout-components
        with:
          ssh-private-key: ${{ secrets.RUNTESSA_COMPONENT_KEYS }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install the headless display used by the extension host
        run: sudo apt-get update && sudo apt-get install --yes xvfb xauth
      - name: Verify extension in an isolated VS Code host
        run: xvfb-run --auto-servernum npm run vscode:test
  publishable-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout pinned component repositories
        uses: ./.github/actions/checkout-components
        with:
          ssh-private-key: ${{ secrets.RUNTESSA_COMPONENT_KEYS }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Verify environment initialization
        run: npm run test:env-setup
      - name: Install checksum-verified Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          install_dir="$RUNNER_TEMP/idpcore-gitleaks"
          mkdir -p "$install_dir"
          cd "$install_dir"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          release="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl --fail --location --silent --show-error "$release/$archive" --output "$archive"
          curl --fail --location --silent --show-error "$release/gitleaks_${GITLEAKS_VERSION}_checksums.txt" --output checksums.txt
          awk -v archive="$archive" '$2 == archive { print }' checksums.txt > selected-checksum.txt
          test -s selected-checksum.txt
          sha256sum --check selected-checksum.txt
          tar -xzf "$archive" gitleaks
          echo "GITLEAKS_BIN=$install_dir/gitleaks" >> "$GITHUB_ENV"
      - name: Scan publishable files with fully redacted output
        run: npm run security:secrets
      - name: Verify publishable history coverage, including detached checkouts
        run: npm run test:secret-scope
      - name: Scan checked-out and publishable history with fully redacted output
        run: npm run security:history
