name: Docker Images

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/docker/**'
      - 'scripts/release/**'
      - 'package.json'
      - 'package-lock.json'
      - 'docker/**'
      - 'docker-compose.yml'
      - '.dockerignore'
      - 'LICENSE'
      - 'NOTICE'
      - 'THIRD_PARTY_NOTICES.md'
      - 'licenses/**'
      - '.github/workflows/docker-images.yml'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

# Serialize publications so simultaneous releases cannot race over latest.
concurrency:
  group: docker-images-${{ github.event_name == 'release' && 'publication' || github.ref }}
  cancel-in-progress: false

jobs:
  release-policy:
    name: Validate image release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      packages: read
    outputs:
      owner: ${{ steps.owner.outputs.value }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
      latest: ${{ steps.release.outputs.latest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Verify release policy regression cases
        run: node --test scripts/release/image-release-policy.test.mjs
      - name: Normalize registry namespace
        id: owner
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "value=${OWNER,,}" >> "$GITHUB_OUTPUT"
      - name: Require tested main commit and private registry destinations
        if: github.event_name == 'release'
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/check-image-release.mjs
      - name: Check registry access without publishing
        if: github.event_name != 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/check-image-release.mjs --registry-only

  docker-compose:
    name: Validate Docker Compose
    runs-on: ubuntu-latest
    needs: release-policy
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/checkout-components
        with:
          ssh-private-key: ${{ secrets.RUNTESSA_COMPONENT_KEYS }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Verify both Compose stacks with fresh private configuration
        run: |
          npm run docker:init-env
          docker compose config --quiet
          docker compose -f docker/docker-compose.yml --env-file docker/.env config --quiet

  build-images:
    name: Build ${{ matrix.service.image_name }}
    runs-on: ubuntu-latest
    needs: [release-policy, docker-compose]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - image_name: auth
            prepare_target: auth
            dockerfile: src/auth/Dockerfile
            install: npm --prefix src/auth ci
          - image_name: runtime
            prepare_target: core
            dockerfile: src/core/Dockerfile
            install: npm ci && npm --prefix src/kernel ci
          - image_name: studio
            prepare_target: ideNew
            dockerfile: src/ideNew/Dockerfile
            install: npm ci
          - image_name: monitoring
            prepare_target: monitoring
            dockerfile: src/monitoring/Dockerfile
            install: ""
          - image_name: container-agent
            prepare_target: container-agent
            dockerfile: src/container-agent/Dockerfile
            install: ""
          - image_name: assistant-gateway
            prepare_target: codex-gateway
            dockerfile: src/codex-gateway/Dockerfile
            install: ""

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Checkout pinned component repositories
        uses: ./.github/actions/checkout-components
        with:
          ssh-private-key: ${{ secrets.RUNTESSA_COMPONENT_KEYS }}
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            src/auth/package-lock.json
            src/container-agent/package-lock.json
            src/core/package-lock.json
            src/ideNew/package-lock.json
            src/kernel/package-lock.json
            src/monitoring/package-lock.json

      - name: Install dependencies
        if: matrix.service.install != ''
        run: ${{ matrix.service.install }}

      - name: Prepare Docker build artifacts
        run: npm run docker:prepare -- ${{ matrix.service.prepare_target }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GHCR
        if: github.event_name == 'release'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ needs.release-policy.outputs.owner }}/${{ matrix.service.image_name }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ needs.release-policy.outputs.version }},enable=${{ github.event_name == 'release' }}
            type=raw,value=sha-${{ needs.release-policy.outputs.sha }},enable=${{ github.event_name == 'release' }}
            type=raw,value=latest,enable=${{ needs.release-policy.outputs.latest == 'true' }}
            type=sha,format=long,prefix=build-,enable=${{ github.event_name != 'release' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.title=Runtessa ${{ matrix.service.image_name }}

      - name: Build image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.service.dockerfile }}
          push: ${{ github.event_name == 'release' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service.image_name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.image_name }}

      - name: Verify published image manifest and record its digest
        if: github.event_name == 'release'
        env:
          IMAGE: ghcr.io/${{ needs.release-policy.outputs.owner }}/${{ matrix.service.image_name }}
          VERSION: ${{ needs.release-policy.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker buildx imagetools inspect "$IMAGE@$DIGEST"
          echo "### $IMAGE:$VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "Digest: $DIGEST" >> "$GITHUB_STEP_SUMMARY"
          echo "Pinned pull: docker pull $IMAGE@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
