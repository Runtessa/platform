name: Docker Images

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/docker/**'
      - 'scripts/release/prepare-monaco.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'docker/**'
      - 'docker-compose.yml'
      - '.dockerignore'
      - 'LICENSE'
      - 'NOTICE'
      - 'THIRD_PARTY_NOTICES.md'
      - 'licenses/**'
      - '.github/workflows/docker-images.yml'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker-local-flow:
    name: Docker Local Flow
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            src/auth/package-lock.json
            src/container-agent/package-lock.json
            src/core/package-lock.json
            src/ideNew/package-lock.json
            src/kernel/package-lock.json
            src/monitoring/package-lock.json

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Verify Docker compose
        run: |
          docker --version
          docker compose version

      - name: Install dependencies required by docker:prepare
        run: |
          npm ci
          npm --prefix src/auth ci
          npm --prefix src/kernel ci
          npm --prefix src/monitoring ci
          npm --prefix src/container-agent ci

      - name: Run exact local Docker flow
        run: |
          npm run docker:init-env
          npm run docker:build:local

  build-images:
    name: Build ${{ matrix.service.image_name }}
    runs-on: ubuntu-latest
    needs: docker-local-flow
    strategy:
      fail-fast: false
      matrix:
        service:
          - image_name: auth
            prepare_target: auth
            dockerfile: src/auth/Dockerfile
            install: npm --prefix src/auth ci
          - image_name: core
            prepare_target: core
            dockerfile: src/core/Dockerfile
            install: npm ci && npm --prefix src/kernel ci
          - image_name: ide
            prepare_target: ideNew
            dockerfile: src/ideNew/Dockerfile
            install: npm ci
          - image_name: monitoring
            prepare_target: monitoring
            dockerfile: src/monitoring/Dockerfile
            install: ""
          - image_name: container-agent
            prepare_target: container-agent
            dockerfile: src/container-agent/Dockerfile
            install: ""
          - image_name: codex-gateway
            prepare_target: codex-gateway
            dockerfile: src/codex-gateway/Dockerfile
            install: ""

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            src/auth/package-lock.json
            src/container-agent/package-lock.json
            src/core/package-lock.json
            src/ideNew/package-lock.json
            src/kernel/package-lock.json
            src/monitoring/package-lock.json

      - name: Install dependencies
        if: matrix.service.install != ''
        run: ${{ matrix.service.install }}

      - name: Prepare Docker build artifacts
        run: npm run docker:prepare -- ${{ matrix.service.prepare_target }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/idpcore-${{ matrix.service.image_name }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=ref,event=branch
            type=sha,format=long,prefix=sha-

      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.service.dockerfile }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service.image_name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.image_name }}
