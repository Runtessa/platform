version: "3.9"

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    env_file:
      - ./docker/env/postgres.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:latest
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  core:
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp=./docker/runtime/seccomp.json
    build:
      context: .
      dockerfile: src/core/Dockerfile
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    ports:
      - "3005:3005"
    volumes:
      - ./docker/env/core.env:/app/src/core/.env:ro

  auth:
    build:
      context: .
      dockerfile: src/auth/Dockerfile
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    ports:
      - "3015:3015"
    volumes:
      - ./docker/env/auth.env:/app/.env:ro

  ide:
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp=./docker/runtime/seccomp.json
    build:
      context: .
      dockerfile: src/ideNew/Dockerfile
    restart: unless-stopped
    depends_on:
      - core
      - auth
    ports:
      - "3002:3000"
    volumes:
      - ./docker/env/ide.env:/app/src/ideNew/.env:ro

  monitoring:
    build:
      context: .
      dockerfile: src/monitoring/Dockerfile
    restart: unless-stopped
    ports:
      - "3011:3011"
    volumes:
      - ./docker/env/monitoring.env:/app/.env:ro

  codex-gateway:
    profiles: ["codex"]
    build:
      context: .
      dockerfile: src/codex-gateway/Dockerfile
    restart: unless-stopped
    ports:
      - "4040:4040"
    volumes:
      - ./docker/env/codex-gateway.env:/app/.env:ro
      - ./src/codex-gateway/data:/data
      - .:/workspace

  container-agent:
    profiles: ["agent"]
    build:
      context: .
      dockerfile: src/container-agent/Dockerfile
    restart: unless-stopped
    ports:
      - "4070:4070"
    volumes:
      - ./docker/env/container-agent.env:/app/.env:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/srv/idp

volumes:
  postgres_data:
  redis_data:
