services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    env_file:
      - ./docker/env/postgres.env
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/10-idpcore-databases.sh:ro

  redis:
    image: redis:8.8-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data

  core:
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp=./docker/runtime/seccomp.json
    build:
      context: .
      dockerfile: src/core/Dockerfile
    env_file:
      - ./docker/env/core.env
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    ports:
      - "127.0.0.1:3005:3005"

  auth:
    build:
      context: .
      dockerfile: src/auth/Dockerfile
    env_file:
      - ./docker/env/auth.env
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    ports:
      - "127.0.0.1:3015:3015"

  ide:
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp=./docker/runtime/seccomp.json
    build:
      context: .
      dockerfile: src/ideNew/Dockerfile
    env_file:
      - ./docker/env/ide.env
    restart: unless-stopped
    depends_on:
      - core
      - auth
    ports:
      - "127.0.0.1:3002:3000"

  monitoring:
    build:
      context: .
      dockerfile: src/monitoring/Dockerfile
    env_file:
      - ./docker/env/monitoring.env
    restart: unless-stopped
    ports:
      - "127.0.0.1:3011:3011"

  codex-gateway:
    profiles: ["codex"]
    build:
      context: .
      dockerfile: src/codex-gateway/Dockerfile
    env_file:
      - ./docker/env/codex-gateway.env
    restart: unless-stopped
    ports:
      - "127.0.0.1:4040:4040"
    volumes:
      - ./src/codex-gateway/data:/data
      - .:/workspace

  container-agent:
    profiles: ["agent"]
    build:
      context: .
      dockerfile: src/container-agent/Dockerfile
    env_file:
      - ./docker/env/container-agent.env
    restart: unless-stopped
    ports:
      - "127.0.0.1:4070:4070"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/srv/idp

volumes:
  postgres_data:
  redis_data:
