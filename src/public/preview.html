<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kernel Preview</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #ffffff;
        color: #111827;
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      }
      #root {
        min-height: 100%;
      }
      #status {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        color: #4b5563;
        background: #ffffff;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="status">Preparing preview...</div>
    <script src="/preview-auth.js"></script>
    <script src="/preview-capture.js"></script>
    <script>
      (function () {
        var statusEl = document.getElementById("status");
        var params = new URLSearchParams(window.location.search);
        var name = params.get("name");
        var version = params.get("version") || "latest";
        var tenantHost = params.get("tenantHost") || "";
        var previewSession = params.get("previewSession") || "";
        var previewRoute = params.get("route") || "/";
        var previewStage =
          params.get("stage") === "published" ? "published" : "draft";
        var registryUrl = params.get("registryUrl") || "/api/registry";
        var kernelMode = params.get("kernelMode") === "source" ? "source" : "bundle";
        var kernelNonce =
          params.get("kernelNonce") || params.get("t") || String(Date.now());
        var kernelScriptSrc = "/bundle.js?v=" + encodeURIComponent(kernelNonce);
        var kernelSourceScriptSrc =
          "/kernel-source.js?v=" + encodeURIComponent(kernelNonce);
        window.__IDP_TENANT_HOST__ = tenantHost;
        window.__IDP_PREVIEW__ = true;
        window.__IDP_PREVIEW_STAGE__ = previewStage;
        window.__IDP_PREVIEW_SESSION__ = previewSession;
        window.__IDP_KERNEL_MODE__ = kernelMode;

        var loadKernelBundle = function () {
          return new Promise(function (resolve, reject) {
            if (window.Kernel) {
              resolve();
              return;
            }
            var existing = document.querySelector(
              "script[data-idp-kernel-bundle='1']"
            );
            if (existing) {
              existing.addEventListener("load", function () {
                resolve();
              });
              existing.addEventListener("error", function () {
                reject(new Error("Kernel bundle failed to load."));
              });
              return;
            }
            var script = document.createElement("script");
            script.src = kernelScriptSrc;
            script.async = false;
            script.setAttribute("data-idp-kernel-bundle", "1");
            script.onload = function () {
              resolve();
            };
            script.onerror = function () {
              reject(new Error("Kernel bundle failed to load."));
            };
            document.head.appendChild(script);
          });
        };

        var loadKernelSource = function () {
          return new Promise(function (resolve, reject) {
            if (window.Kernel) {
              resolve();
              return;
            }
            var existing = document.querySelector(
              "script[data-idp-kernel-source='1']"
            );
            if (existing) {
              existing.addEventListener("load", function () {
                resolve();
              });
              existing.addEventListener("error", function () {
                reject(new Error("Kernel source runtime failed to load."));
              });
              return;
            }
            var script = document.createElement("script");
            script.type = "module";
            script.src = kernelSourceScriptSrc;
            script.async = false;
            script.setAttribute("data-idp-kernel-source", "1");
            script.onload = function () {
              if (window.Kernel) {
                resolve();
                return;
              }
              reject(new Error("Kernel source runtime did not expose window.Kernel."));
            };
            script.onerror = function () {
              reject(new Error("Kernel source runtime failed to load."));
            };
            document.head.appendChild(script);
          });
        };

        var loadKernelRuntime = function () {
          if (kernelMode === "source") {
            return loadKernelSource().catch(function () {
              return loadKernelBundle();
            });
          }
          return loadKernelBundle();
        };

        var normalizePreviewRoute = function (value) {
          var raw = String(value || "").trim();
          if (!raw) return "/";
          if (/^https?:\/\//i.test(raw)) {
            try {
              var parsed = new URL(raw);
              return (
                (parsed.pathname || "/") +
                (parsed.search || "") +
                (parsed.hash || "")
              );
            } catch (error) {
              return "/";
            }
          }
          if (raw.charAt(0) === "?" || raw.charAt(0) === "#") {
            return "/" + raw;
          }
          return raw.charAt(0) === "/" ? raw : "/" + raw;
        };

        var previewRoutePath = normalizePreviewRoute(previewRoute);
        var applyPreviewRoute = function (routeValue) {
          var normalized = normalizePreviewRoute(routeValue);
          try {
            var nextUrl = new URL(normalized, window.location.origin);
            window.history.replaceState(
              { __idpPreview: true, route: normalized },
              "",
              nextUrl.pathname + nextUrl.search + nextUrl.hash
            );
            try {
              window.dispatchEvent(
                new PopStateEvent("popstate", { state: window.history.state })
              );
            } catch (eventError) {
              // no-op
            }
          } catch (error) {
            // ignore invalid route rewrite
          }
        };

        window.addEventListener("message", function (event) {
          var payload = event && event.data ? event.data : null;
          if (!payload || typeof payload !== "object") return;
          if (String(payload.source || "") !== "idp-preview-control") return;
          if (String(payload.action || "") !== "navigate") return;
          applyPreviewRoute(payload.route || "/");
        });
        applyPreviewRoute("/");

        var toText = function (value) {
          if (value == null) return "";
          if (typeof value === "string") return value;
          if (typeof value === "number" || typeof value === "boolean") {
            return String(value);
          }
          if (value instanceof Error) {
            return value.message || String(value);
          }
          try {
            return JSON.stringify(value);
          } catch (error) {
            return String(value);
          }
        };

        var nowMs = function () {
          try {
            if (
              typeof window.performance !== "undefined" &&
              window.performance &&
              typeof window.performance.now === "function"
            ) {
              return window.performance.now();
            }
          } catch (error) {}
          return Date.now();
        };

        var nextEventId = function (prefix) {
          return (
            String(prefix || "evt") +
            "-" +
            Date.now() +
            "-" +
            Math.random().toString(36).slice(2, 8)
          );
        };

        var sendPreviewException = function (payload) {
          try {
            if (!window.parent || window.parent === window) return;
            window.parent.postMessage(
              {
                source: "idp-preview-exception",
                payload: Object.assign(
                  {
                    createdAt: new Date().toISOString(),
                    previewName: name || "",
                    previewVersion: version || "",
                    previewSession: previewSession || "",
                    tenantHost: tenantHost || "",
                    href: window.location.href,
                    kernelBuild:
                      typeof window.__IDP_KERNEL_BUILD__ === "string"
                        ? String(window.__IDP_KERNEL_BUILD__)
                        : "",
                  },
                  payload || {}
                ),
              },
              "*"
            );
          } catch (error) {
            // no-op
          }
        };

        window.addEventListener("error", function (event) {
          sendPreviewException({
            id: nextEventId("runtime"),
            category: "runtime",
            kind: "runtime-error",
            level: "error",
            message: toText(event && event.message ? event.message : "Runtime error"),
            stack:
              event && event.error && event.error.stack
                ? toText(event.error.stack)
                : "",
            sourceUrl: event && event.filename ? String(event.filename) : "",
            line: event && typeof event.lineno === "number" ? event.lineno : null,
            column: event && typeof event.colno === "number" ? event.colno : null,
          });
        });

        window.addEventListener("unhandledrejection", function (event) {
          var reason = event ? event.reason : null;
          var message =
            reason && typeof reason === "object" && reason.message
              ? toText(reason.message)
              : toText(reason || "Unhandled promise rejection");
          sendPreviewException({
            id: nextEventId("runtime"),
            category: "runtime",
            kind: "unhandled-rejection",
            level: "error",
            message: message || "Unhandled promise rejection",
            stack:
              reason && typeof reason === "object" && reason.stack
                ? toText(reason.stack)
                : "",
          });
        });

        if (window.console && typeof window.console.log === "function") {
          ["log", "info", "warn", "error", "debug"].forEach(function (level) {
            if (typeof window.console[level] !== "function") return;
            var originalConsoleMethod = window.console[level].bind(window.console);
            window.console[level] = function () {
              var args = Array.prototype.slice.call(arguments || []);
              sendPreviewException({
                id: nextEventId("console"),
                category: "console",
                kind: "console-" + level,
                level: level === "warn" ? "warn" : level === "error" ? "error" : "info",
                message:
                  args
                    .map(function (arg) {
                      return toText(arg);
                    })
                    .join(" ")
                    .trim() || "console." + level,
              });
              return originalConsoleMethod.apply(window.console, args);
            };
          });
        }

        if (!name) {
          statusEl.textContent = "No preview target selected.";
          return;
        }

        var previewAuth = window.RuntessaPreviewAuth.connect(window, {
          editorOrigin: params.get("editorOrigin") || "",
          previewSession: previewSession,
          tenantHost: tenantHost,
          stage: previewStage,
        });

        if (window.fetch) {
          var originalFetch = window.fetch.bind(window);
          window.fetch = function (input, init) {
            var nextInit = init || {};
            var headers = new Headers(nextInit.headers || (input && input.headers) || {});
            nextInit.headers = headers;
            var requestUrl = "";
            try {
              if (typeof input === "string") {
                requestUrl = input;
              } else if (input && typeof input.url === "string") {
                requestUrl = input.url;
              }
            } catch (error) {
              requestUrl = "";
            }
            var requestMethod = String(nextInit.method || "GET").toUpperCase();
            var requestId = nextEventId("network");
            var startedAt = nowMs();
            sendPreviewException({
              id: requestId,
              requestId: requestId,
              category: "network",
              kind: "network-request",
              level: "info",
              message: requestMethod + " " + (requestUrl || "(unknown url)"),
              requestUrl: requestUrl,
              method: requestMethod,
            });
            return originalFetch(input, nextInit)
              .then(function (response) {
                var durationMs = Math.max(0, Math.round(nowMs() - startedAt));
                var responseBytes = null;
                var contentLengthHeader =
                  response && response.headers
                    ? response.headers.get("content-length")
                    : null;
                if (
                  contentLengthHeader &&
                  !Number.isNaN(Number(contentLengthHeader))
                ) {
                  responseBytes = Number(contentLengthHeader);
                }
                sendPreviewException({
                  id: nextEventId("network"),
                  requestId: requestId,
                  category: "network",
                  kind: "network-response",
                  level: response && response.ok ? "info" : "error",
                  message:
                    requestMethod +
                    " " +
                    (requestUrl || "(unknown url)") +
                    " -> " +
                    String(response ? response.status : 0),
                  requestUrl: requestUrl,
                  method: requestMethod,
                  status: response ? response.status : null,
                  statusText: response ? String(response.statusText || "") : "",
                  durationMs: durationMs,
                  responseBytes: responseBytes,
                });
                if (!response || response.ok) return response;
                var report = {
                  id: nextEventId("network"),
                  requestId: requestId,
                  category: "network",
                  kind: "http-error",
                  level: "error",
                  message:
                    "HTTP " +
                    String(response.status) +
                    " " +
                    String(response.statusText || ""),
                  requestUrl: requestUrl,
                  method: requestMethod,
                  status: response.status,
                  statusText: String(response.statusText || ""),
                  durationMs: durationMs,
                  responseBytes: responseBytes,
                };
                try {
                  var clone = response.clone();
                  clone
                    .text()
                    .then(function (text) {
                      sendPreviewException(
                        Object.assign({}, report, {
                          responseSnippet: String(text || "").slice(0, 2000),
                        })
                      );
                    })
                    .catch(function () {
                      sendPreviewException(report);
                    });
                } catch (error) {
                  sendPreviewException(report);
                }
                return response;
              })
              .catch(function (error) {
                var durationMs = Math.max(0, Math.round(nowMs() - startedAt));
                sendPreviewException({
                  id: nextEventId("network"),
                  requestId: requestId,
                  category: "network",
                  kind: "network-error",
                  level: "error",
                  message:
                    (error && error.message) || "Network request failed in preview.",
                  stack: error && error.stack ? String(error.stack) : "",
                  requestUrl: requestUrl,
                  method: requestMethod,
                  durationMs: durationMs,
                });
                throw error;
              });
          };
        }

        statusEl.textContent = "Loading preview...";
        previewAuth.ready.then(loadKernelRuntime)
          .then(function () {
            if (!window.Kernel) {
              throw new Error("Kernel runtime failed to load.");
            }
            var kernel = new window.Kernel({ registryUrl: registryUrl });
            return kernel.boot(name, "root", version);
          })
          .then(function () {
            applyPreviewRoute(previewRoutePath);
            if (statusEl) {
              statusEl.remove();
            }
          })
          .catch(function (error) {
            var message =
              (error && error.message) || "Failed to load preview.";
            statusEl.textContent = message;
            sendPreviewException({
              id: nextEventId("system"),
              category:
                message === "Kernel runtime failed to load."
                  ? "system"
                  : "runtime",
              kind:
                message === "Kernel runtime failed to load."
                  ? "kernel-load-error"
                  : "preview-boot-error",
              level: "error",
              message: message,
              stack: error && error.stack ? String(error.stack) : "",
            });
          });
      })();
    </script>
  </body>
</html>
